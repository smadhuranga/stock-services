server:
  port: 8081

spring:
  application:
    name: stock-service
  config:
    import: "optional:configserver:http://localhost:8888"
  datasource:
    host: 172.30.0.2
    username: root
    password: mysql
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
